name: Restyled

on:
  workflow_call:
    inputs:
      ref:
        description: 'The git reference to checkout'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-results:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts (for backup)
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
      
      - name: Show downloaded artifacts
        run: |
          echo "📁 Downloaded artifacts for backup:"
          find test-results/ -type f | head -20

      - name: Execute Cypress Tests with Percy
        working-directory: client
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_COMMIT: ${{ github.sha }}
          PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          echo "🎯 Starting Cypress tests with Percy..."
          
          mkdir -p ../test-artifacts
          
          docker compose run \
            -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e PERCY_COMMIT="${{ github.sha }}" \
            -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
            -e CYPRESS_baseUrl="http://server:5000" \
            cypress \
            bash -c "
              echo '=== Running Cypress Tests with Percy ==='
              # Install percy if not available
              npm install @percy/cli@1.28.8 || echo 'Percy already installed'
              
              # Run with Percy
              npx @percy/cli exec -- npx cypress run --reporter spec --browser chrome
              echo 'Exit code:' \$?
            " 2>&1 | tee ../test-artifacts/cypress-percy-logs.txt

      - name: Upload Screenshots to Percy
        if: always()
        working-directory: client
        run: |
          echo "📸 Uploading screenshots to Percy..."
          
          # Extract screenshots from artifacts
          if [ -d "../test-artifacts/screenshots" ]; then
            # Install Percy CLI
            npm install @percy/cli@1.28.8
            
            # Create Percy build
            npx @percy/cli upload ../test-artifacts/screenshots \
              --config percy.config.js
          else
            echo "No screenshots found to upload"
          fi

      - name: Add Artifact Links to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🧪 Test Results
            
            📹 **Test Videos Available**: [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Test execution completed. Videos and screenshots are available in the GitHub Actions artifacts.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
