name: Restyled

on:
  workflow_call:
    inputs:
      ref:
        description: "The git reference to checkout"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts (for backup)
        uses: actions/download-artifact@v8
        with:
          name: e2e-test-results
          path: test-results/

      - name: Show downloaded artifacts
        run: |
          echo "📁 Downloaded artifacts for backup:"
          find test-results/ -type f | head -20

      - name: Upload Screenshots to Percy
        if: always()
        run: |
          echo "📸 Uploading screenshots to Percy..."

          # Check what we downloaded
          if [ -d "test-results/screenshots" ]; then
            echo "Found screenshots, uploading to Percy..."
            
            # Create temporary directory for Percy
            mkdir -p temp-percy
            cd temp-percy
            
            # Initialize npm and install Percy
            npm init -y
            npm install @percy/cli@1.28.8
            
            # Upload screenshots to Percy
            PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            PERCY_COMMIT="${{ github.sha }}" \
            npx @percy/cli upload ../test-results/screenshots
          else
            echo "No screenshots found to upload"
          fi

      - name: Add Artifact Links to PR (on failure)
        if: failure() && github.event_name == 'pull_request' && needs.frontend-unit-tests.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;

            // Check check-runs for this commit and skip if Restyled failed
            const checks = await github.rest.checks.listForRef({ owner, repo, ref });
            const restyled = checks.data.check_runs.find(c => c.name === 'Restyled' || c.name === 'restyled');
            if (restyled && restyled.conclusion === 'failure') {
              console.log('Restyled check failed — skipping artifact comment.');
              return;
            }

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const comment = `## ❌ Test Failure Detected

            📹 **Test Videos Available**: [Download Artifacts](${runUrl})

            Test execution failed. Videos and screenshots are available in the GitHub Actions artifacts for debugging.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner,
              repo,
              body: comment
            });
