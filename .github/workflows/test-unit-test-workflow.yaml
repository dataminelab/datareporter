name: "Test Unit Tests Workflow"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-unit.yaml'
  pull_request:
    paths:
      - '.github/workflows/test-unit.yaml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test-workflow-yaml-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml
          import sys
          
          try:
              with open('.github/workflows/test-unit.yaml', 'r') as f:
                  workflow = yaml.safe_load(f)
              print('✅ YAML syntax is valid')
              
              # Basic structure validation - handle YAML boolean parsing of 'on'
              required_fields = ['name', 'jobs']  # Check for 'on' separately
              for field in required_fields:
                  if field not in workflow:
                      print(f'❌ Missing required field: {field}')
                      print(f'Available fields: {list(workflow.keys())}')
                      sys.exit(1)
              
              # Check for 'on' field - it might be parsed as boolean True
              if 'on' not in workflow and True not in workflow:
                  print('❌ Missing workflow trigger (on:)')
                  print(f'Available fields: {list(workflow.keys())}')
                  sys.exit(1)
              elif True in workflow:
                  print('✅ Workflow triggers found (parsed as boolean)')
              else:
                  print('✅ Workflow triggers found')
              
              print('✅ Required top-level fields present')
              
              # Optional: Check if env exists and report
              if 'env' in workflow:
                  print('✅ Global environment variables found')
              else:
                  print('ℹ️  No global environment variables (optional)')
                  
          except yaml.YAMLError as e:
              print(f'❌ YAML syntax error: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Validation error: {e}')
              sys.exit(1)
          "

  test-job-structure-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test job existence and basic structure
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          
          # Test all expected jobs exist
          expected_jobs = [
              'workflow-self-test', 'restyled', 'backend-lint', 
              'backend-unit-tests', 'frontend-lint', 'frontend-unit-tests', 
              'frontend-e2e-tests'
          ]
          
          for job_name in expected_jobs:
              assert job_name in jobs, f'Missing job: {job_name}'
              job = jobs[job_name]
              
              # Jobs using reusable workflows (uses:) don't need runs-on or steps
              if 'uses' in job:
                  print(f'✅ {job_name} uses reusable workflow: {job[\"uses\"]}')
                  # Reusable workflows should have 'with' or other parameters
                  continue
              else:
                  # Regular jobs need runs-on and steps
                  assert 'runs-on' in job, f'Job {job_name} missing runs-on'
                  assert 'steps' in job, f'Job {job_name} missing steps'
                  print(f'✅ {job_name} is a regular job with runs-on: {job[\"runs-on\"]}')
          
          print('✅ All expected jobs exist with proper structure')
          "
      
      - name: Test job dependency chain
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          print(f'Found jobs: {list(jobs.keys())}')
          
          # Test specific dependencies only for jobs that exist
          dependency_tests = {
              'restyled': 'workflow-self-test',
              'backend-lint': 'workflow-self-test', 
              'backend-unit-tests': 'backend-lint',
              'frontend-lint': 'restyled',
              'frontend-unit-tests': 'frontend-lint',
              'frontend-e2e-tests': 'frontend-lint'
          }
          
          for job_name, expected_dependency in dependency_tests.items():
              if job_name not in jobs:
                  print(f'ℹ️  Job {job_name} not found (skipping dependency check)')
                  continue
                  
              job = jobs[job_name]
              if 'needs' not in job:
                  print(f'ℹ️  Job {job_name} has no dependencies')
                  continue
                  
              needs = job['needs']
              if isinstance(needs, list):
                  if expected_dependency in needs:
                      print(f'✅ Job {job_name} correctly depends on {expected_dependency}')
                  else:
                      print(f'ℹ️  Job {job_name} depends on {needs}, expected {expected_dependency}')
              else:
                  if needs == expected_dependency:
                      print(f'✅ Job {job_name} correctly depends on {expected_dependency}')
                  else:
                      print(f'ℹ️  Job {job_name} depends on {needs}, expected {expected_dependency}')
          
          # Test analyze-test-results depends on test jobs (if it exists)
          if 'analyze-test-results' in jobs:
              analyze_job = jobs['analyze-test-results']
              if 'needs' in analyze_job:
                  print(f'✅ analyze-test-results found with dependencies: {analyze_job[\"needs\"]}')
              else:
                  print('ℹ️  analyze-test-results has no dependencies')
          else:
              print('ℹ️  analyze-test-results job not found (this is normal)')
          
          print('✅ Job dependency analysis completed')
          "

  test-conditional-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test PR-only job conditions
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          
          # Jobs that should only run on PRs (if they exist)
          pr_only_jobs = [
              'workflow-self-test', 'restyled', 'frontend-lint', 
              'frontend-unit-tests', 'frontend-e2e-tests'
          ]
          
          for job_name in pr_only_jobs:
              if job_name not in jobs:
                  print(f'ℹ️  Job {job_name} not found (skipping condition check)')
                  continue
                  
              job = jobs[job_name]
              if 'if' not in job:
                  print(f'ℹ️  Job {job_name} has no conditional execution')
                  continue
                  
              condition = job['if']
              if \"github.event_name == 'pull_request'\" in condition:
                  print(f'✅ Job {job_name} correctly runs only on PRs')
              else:
                  print(f'ℹ️  Job {job_name} condition: {condition}')
          
          # Test analyze-test-results has proper condition (if it exists)
          if 'analyze-test-results' in jobs:
              analyze_job = jobs['analyze-test-results']
              if 'if' in analyze_job:
                  condition = analyze_job['if']
                  if 'always()' in condition:
                      print('✅ analyze-test-results runs even on failure')
                  if \"github.event_name == 'pull_request'\" in condition:
                      print('✅ analyze-test-results only runs on PRs')
              else:
                  print('ℹ️  analyze-test-results has no conditions')
          
          print('✅ Conditional execution analysis completed')
          "
      
      - name: Test mergeable checks in job steps
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          
          # Jobs that should check PR mergeability
          mergeable_check_jobs = [
              'backend-lint', 'backend-unit-tests', 'frontend-lint', 
              'frontend-unit-tests', 'frontend-e2e-tests'
          ]
          
          for job_name in mergeable_check_jobs:
              job = jobs[job_name]
              steps = job['steps']
              
              # Find mergeable check step (should be first step)
              first_step = steps[0]
              assert 'if' in first_step, f'Job {job_name} first step should check mergeability'
              assert 'mergeable' in first_step['if'], f'Job {job_name} should check PR mergeability'
              assert 'exit 1' in first_step.get('run', ''), f'Job {job_name} should exit on unmergeable PR'
          
          print('✅ Mergeable PR checks are configured correctly')
          "

  test-environment-variables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test global environment variables
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          # Check if global env exists
          if 'env' not in workflow:
              print('ℹ️  No global environment variables defined (this is fine)')
              exit(0)
          
          env_vars = workflow['env']
          print(f'Found global environment variables: {list(env_vars.keys())}')
          
          # Test common env vars if they exist
          common_vars = ['NODE_VERSION', 'NPM_VERSION', 'REDASH_COOKIE_SECRET']
          found_vars = []
          missing_vars = []
          
          for var in common_vars:
              if var in env_vars:
                  found_vars.append(var)
                  print(f'✅ Found {var}: {env_vars[var]}')
              else:
                  missing_vars.append(var)
          
          if missing_vars:
              print(f'ℹ️  Missing optional environment variables: {missing_vars}')
          
          # Test Node version if it exists (don't assume version)
          if 'NODE_VERSION' in env_vars:
              node_version = env_vars['NODE_VERSION']
              print(f'ℹ️  Node version configured: {node_version}')
              # Just validate it's a reasonable version number
              if node_version in ['16', '18', '20', '21']:
                  print(f'✅ Node version {node_version} is supported')
              else:
                  print(f'⚠️  Unusual Node version: {node_version}')
          else:
              print('ℹ️  NODE_VERSION not set globally (may be set in individual jobs)')
          
          print('✅ Global environment variables check completed')
          "
      
      - name: Test Docker environment configuration
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          
          # Test backend job Docker env (if it exists)
          if 'backend-unit-tests' in jobs:
              backend_job = jobs['backend-unit-tests']
              if 'env' in backend_job:
                  backend_env = backend_job['env']
                  print(f'Backend environment variables: {list(backend_env.keys())}')
                  
                  docker_vars = ['COMPOSE_FILE', 'COMPOSE_PROJECT_NAME', 'COMPOSE_DOCKER_CLI_BUILD', 'DOCKER_BUILDKIT']
                  found_docker_vars = [var for var in docker_vars if var in backend_env]
                  missing_docker_vars = [var for var in docker_vars if var not in backend_env]
                  
                  if found_docker_vars:
                      print(f'✅ Found Docker variables: {found_docker_vars}')
                  if missing_docker_vars:
                      print(f'ℹ️  Missing Docker variables: {missing_docker_vars}')
                      
                  if 'COMPOSE_PROJECT_NAME' in backend_env:
                      print(f'✅ Backend compose project: {backend_env[\"COMPOSE_PROJECT_NAME\"]}')
              else:
                  print('ℹ️  Backend job has no environment variables')
          else:
              print('ℹ️  backend-unit-tests job not found')
          
          # Test e2e job Docker env (if it exists)
          if 'frontend-e2e-tests' in jobs:
              e2e_job = jobs['frontend-e2e-tests']
              if 'env' in e2e_job:
                  e2e_env = e2e_job['env']
                  print(f'E2E environment variables: {list(e2e_env.keys())}')
                  
                  if 'COMPOSE_PROJECT_NAME' in e2e_env:
                      print(f'✅ E2E compose project: {e2e_env[\"COMPOSE_PROJECT_NAME\"]}')
                  if 'COMPOSE_FILE' in e2e_env:
                      print(f'✅ E2E compose file: {e2e_env[\"COMPOSE_FILE\"]}')
              else:
                  print('ℹ️  E2E job has no environment variables')
          else:
              print('ℹ️  frontend-e2e-tests job not found')
          
          print('✅ Docker environment configuration analysis completed')
          "

  test-percy-and-cypress-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Percy environment variables
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          job_env = e2e_job['env']
          
          # Test Percy configuration
          percy_vars = [
              'PERCY_TOKEN', 'PERCY_PROJECT', 'PERCY_PARALLEL_TOTAL', 
              'PERCY_PARALLEL_NONCE', 'PERCY_PARALLEL', 'PERCY_BRANCH', 
              'PERCY_COMMIT', 'PERCY_PULL_REQUEST', 'PERCY_LOGLEVEL'
          ]
          
          for var in percy_vars:
              assert var in job_env, f'Missing Percy environment variable: {var}'
          
          # Test Cypress configuration
          cypress_vars = ['CYPRESS_PROJECT_ID', 'CYPRESS_RECORD_KEY']
          for var in cypress_vars:
              assert var in job_env, f'Missing Cypress environment variable: {var}'
          
          # Test Percy project references correct secret
          assert 'CYPRESS_PROJECT_ID' in job_env['PERCY_PROJECT'], 'PERCY_PROJECT should reference CYPRESS_PROJECT_ID'
          
          print('✅ Percy and Cypress environment variables are properly configured')
          "
      
      - name: Test Percy step-level environment consistency
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          
          # Find Execute Cypress Tests step
          cypress_step = None
          for step in e2e_job['steps']:
              if step.get('name') == 'Execute Cypress Tests':
                  cypress_step = step
                  break
          
          assert cypress_step is not None, 'Execute Cypress Tests step not found'
          
          step_env = cypress_step.get('env', {})
          job_env = e2e_job['env']
          
          # Test key Percy vars are in step env
          key_vars = ['PERCY_TOKEN', 'PERCY_PROJECT', 'PERCY_PARALLEL_TOTAL', 'PERCY_PARALLEL_NONCE']
          for var in key_vars:
              assert var in step_env, f'Missing {var} in step environment'
          
          print('✅ Percy step-level environment is consistent')
          "

  test-timeout-and-resource-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test job timeouts
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          
          # Test specific timeout configurations
          timeout_expectations = {
              'backend-lint': 5,
              'backend-unit-tests': 60,
              'frontend-lint': 60
          }
          
          for job_name, expected_timeout in timeout_expectations.items():
              job = jobs[job_name]
              assert 'timeout-minutes' in job, f'Job {job_name} should have timeout configured'
              assert job['timeout-minutes'] == expected_timeout, f'Job {job_name} timeout should be {expected_timeout} minutes'
          
          print('✅ Job timeouts are properly configured')
          "

  test-flaky-test-handling-and-retry-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test retry logic in e2e tests
        run: |
          python3 -c "
          import yaml
          import re
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          
          # Find Execute Cypress Tests step
          cypress_step = None
          for step in e2e_job['steps']:
              if step.get('name') == 'Execute Cypress Tests':
                  cypress_step = step
                  break
          
          assert cypress_step is not None, 'Execute Cypress Tests step not found'
          
          run_script = cypress_step['run']
          
          # Test retry logic components
          assert 'attempt=1' in run_script, 'Should initialize attempt counter'
          assert 'max_attempts=3' in run_script, 'Should have max attempts configured'
          assert 'while [ \$attempt -le \$max_attempts ]' in run_script, 'Should have retry loop'
          assert 'sleep 30' in run_script, 'Should have delay between retries'
          assert '((attempt++))' in run_script, 'Should increment attempt counter'
          
          # Test Docker compose command structure
          assert 'docker compose run' in run_script, 'Should use docker compose run'
          assert 'percy exec' in run_script, 'Should use percy exec'
          
          print('✅ Retry logic is properly implemented')
          "
      
      - name: Test failure artifact collection
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          # Test workflow-self-test failure handling
          self_test_job = workflow['jobs']['workflow-self-test']
          steps = self_test_job['steps']
          
          failure_steps = [step for step in steps if step.get('if') == 'failure()']
          assert len(failure_steps) >= 3, 'Should have multiple failure handling steps'
          
          # Test specific failure handling steps
          step_names = [step.get('name', '') for step in failure_steps]
          expected_patterns = ['Debug Info', 'Collect', 'Upload']
          
          for pattern in expected_patterns:
              assert any(pattern in name for name in step_names), f'Should have step containing {pattern}'
          
          # Test e2e failure handling
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          e2e_failure_steps = [step for step in e2e_job['steps'] if step.get('if') == 'failure()']
          assert len(e2e_failure_steps) >= 2, 'E2E job should have failure handling steps'
          
          print('✅ Failure artifact collection is properly configured')
          "

  test-docker-container-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Analyze Docker container lifecycle issues
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          steps = e2e_job['steps']
          
          # Find all steps that interact with Docker
          docker_steps = []
          for step in steps:
              run_command = step.get('run', '')
              if 'docker' in run_command.lower():
                  docker_steps.append({
                      'name': step.get('name', 'Unnamed'),
                      'run': run_command
                  })
          
          print(f'Found {len(docker_steps)} steps using Docker:')
          for i, step in enumerate(docker_steps):
              print(f'{i+1}. {step[\"name\"]}')
          
          # Analyze retry logic for Docker issues
          cypress_step = next((step for step in steps if step.get('name') == 'Execute Cypress Tests'), None)
          if cypress_step:
              run_script = cypress_step['run']
              
              # Check for potential Docker state issues in retry logic
              issues = []
              
              if 'docker compose down' not in run_script:
                  issues.append('Retry logic does not clean up containers between attempts')
              
              if 'docker compose ps' not in run_script:
                  issues.append('No container status check in retry logic')
              
              if len(issues) > 0:
                  print('⚠️  Potential Docker issues in retry logic:')
                  for issue in issues:
                      print(f'  - {issue}')
              else:
                  print('✅ Docker retry logic appears sound')
          
          print('\\n🔍 Recommendation: Add container cleanup between retry attempts')
          print('   Example: docker compose -p cypress down && docker compose -p cypress up -d')
          "

  test-artifact-and-reporting-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test artifact upload configuration
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          jobs = workflow['jobs']
          
          # Test workflow-self-test artifact upload
          self_test_job = jobs['workflow-self-test']
          upload_steps = [step for step in self_test_job['steps'] if step.get('uses', '').startswith('actions/upload-artifact')]
          assert len(upload_steps) == 1, 'Should have one artifact upload step'
          
          upload_step = upload_steps[0]
          assert 'cypress-failure-artifacts' in upload_step['with']['name'], 'Artifact name should indicate failure type'
          assert 'retention-days' in upload_step['with'], 'Should specify retention period'
          
          # Test other artifact uploads
          backend_job = jobs['backend-unit-tests']
          backend_steps = backend_job['steps']
          
          # Should have coverage and test result handling
          coverage_step = next((step for step in backend_steps if 'CodeCoverageSummary' in step.get('uses', '')), None)
          assert coverage_step is not None, 'Should have code coverage step'
          
          junit_step = next((step for step in backend_steps if 'junit-report' in step.get('uses', '')), None)
          assert junit_step is not None, 'Should have JUnit report step'
          
          print('✅ Artifact and reporting configuration is correct')
          "

  test-permissions-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test workflow permissions
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          permissions = workflow.get('permissions', {})
          
          # Test required permissions
          required_permissions = ['contents', 'pull-requests', 'checks']
          for perm in required_permissions:
              assert perm in permissions, f'Missing permission: {perm}'
          
          # Test permission levels
          assert permissions['contents'] == 'read', 'Contents should be read-only'
          assert permissions['pull-requests'] == 'write', 'PR permission needed for comments'
          assert permissions['checks'] == 'write', 'Checks permission needed for test reports'
          
          print('✅ Workflow permissions are properly configured')
          "

  identify-flaky-test-root-causes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Analyze potential flaky test causes
        run: |
          python3 -c "
          import yaml
          
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
          
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          
          print('🔍 Analyzing potential causes of flaky E2E tests:')
          print('=' * 60)
          
          # Check for timing issues
          setup_steps = [step for step in e2e_job['steps'] if 'Setup' in step.get('name', '')]
          for step in setup_steps:
              run_command = step.get('run', '')
              if 'sleep' in run_command:
                  import re
                  sleep_matches = re.findall(r'sleep (\d+)', run_command)
                  if sleep_matches:
                      print(f'⏱️  Fixed sleep found: {sleep_matches[0]} seconds in {step.get(\"name\")}')
          
          # Check for hardcoded waits vs dynamic waits
          print('\\n📋 Recommendations to reduce flakiness:')
          print('1. Replace fixed sleeps with health checks')
          print('2. Add container cleanup between retry attempts')
          print('3. Use docker compose wait conditions')
          print('4. Implement proper service discovery')
          print('5. Add network connectivity checks')
          
          # Check retry configuration
          cypress_step = next((step for step in e2e_job['steps'] if 'Execute Cypress Tests' in step.get('name', '')), None)
          if cypress_step and 'max_attempts=3' in cypress_step.get('run', ''):
              print('\\n✅ Retry mechanism is configured (3 attempts)')
          else:
              print('\\n⚠️  No retry mechanism found')
          
          print('\\n🐳 Docker-specific recommendations:')
          print('- Add \"docker compose down\" before retry attempts')
          print('- Check container health status before proceeding')
          print('- Use unique project names to avoid conflicts')
          print('- Implement proper volume cleanup between runs')
          "

  suggest-workflow-improvements:
    runs-on: ubuntu-latest
    if: always()
    needs: [
      test-workflow-yaml-validity,
      test-job-structure-and-dependencies, 
      test-conditional-execution,
      test-environment-variables,
      test-percy-and-cypress-configuration,
      test-timeout-and-resource-configuration,
      test-flaky-test-handling-and-retry-logic,
      test-docker-container-management,
      test-artifact-and-reporting-configuration,
      test-permissions-and-security,
      identify-flaky-test-root-causes
    ]
    steps:
      - name: Summarize test results and suggestions
        run: |
          echo "## 🧪 Workflow Test Summary"
          echo "================================"
          echo ""
          echo "### ✅ Validated Components:"
          echo "- YAML syntax and structure"
          echo "- Job dependencies and execution order"
          echo "- Environment variable configuration"
          echo "- Percy/Cypress integration"
          echo "- Timeout and resource settings"
          echo "- Artifact collection and reporting"
          echo "- Security permissions"
          echo ""
          echo "### 🔧 Recommended Improvements for Flaky Tests:"
          echo ""
