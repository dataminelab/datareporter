name: "Unit Tests"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, develop]
env:
  NODE_VERSION: 18
  NPM_VERSION: 9.5.1
  REDASH_COOKIE_SECRET: "${secrets.REDASH_COOKIE_SECRET}"

permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  restyled:
    uses: ./.github/workflows/restyled.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  backend-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m ensurepip --upgrade
      - run: sudo pip install black==23.1.0 ruff==0.0.287
      - run: ruff check .
      - run: black --check .
  backend-unit-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      COMPOSE_FILE: .ci/compose.ci.yml
      COMPOSE_PROJECT_NAME: server
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.12.1
      - name: Build docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev" --build-arg skip_frontend_build=true
          docker compose up -d
          sleep 10
      - name: Create Test Database
        run: docker compose -p server run --rm postgres psql -h postgres -U postgres -c "create database tests;"
      - name: List Enabled Query Runners
        run: docker compose -p server run --rm server manage ds list_types
      - name: Run Tests
        shell: bash
        run: |-
          docker compose  -p server run  --user 0 --name tests server tests --junitxml=junit.xml --cov-report=xml --cov=redash --cov-config=.coveragerc tests/
      - name: Copy Test Results
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Extract test results"
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Publish unit test report"
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          fail_on_failure: true
          report_paths: results.xml
          require_tests: true
          include_passed: true
          summary: true
          job_summary: true
          check_name: "Unit Tests Report"
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
  frontend-lint:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: 'npm'
      - name: Install Dependencies
        working-directory: client
        run: npm install
      - name: Run Lint
        working-directory: client
        run: npm run lint
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: /tmp/test-results
  frontend-unit-tests:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: Linux-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: Linux-node-
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install App dependencies
        working-directory: client
        run: npm install
      - name: List the state of node modules
        working-directory: client
        run: npm list
      - name: Build App
        working-directory: client
        run: npm run build
      - name: Run App Tests
        working-directory: client
        run: npm run test
      - name: Run Visualizations Tests
        working-directory: viz-lib
        run: npm run test
      - name: Install plywood-server dependencies
        working-directory: plywood
        run: npm install
      - name: Run plywood-server Tests
        working-directory: plywood
        run: npm run test
      - name: Install plywood-client dependencies
        working-directory: plywood/client
        run: npm install
      - name: Run plywood-client Tests
        working-directory: plywood/client
        run: npm run test
      - name: turnilo tests
        working-directory: client/app/components/TurniloComponent
        run: npm install && npm run test:client
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    needs: frontend-lint
    env:
      COMPOSE_FILE: .ci/compose.cypress.yml
      COMPOSE_PROJECT_NAME: cypress
      # CYPRESS_INSTALL_BINARY: 0
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      COMPOSE_BAKE: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      PERCY_PARALLEL_TOTAL: 1
      PERCY_PARALLEL_NONCE: ${{ github.run_id }}
      PERCY_PARALLEL: true
      PERCY_BRANCH: ${{ github.head_ref }}
      PERCY_COMMIT: ${{ github.sha }}
      PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
      COMMIT_INFO_BRANCH: ${{ github.head_ref }}
      COMMIT_INFO_MESSAGE: ${{ github.event.pull_request.title }}
      COMMIT_INFO_AUTHOR: ${{ github.event.pull_request.user.login }}
      COMMIT_INFO_SHA: ${{ github.sha }}
      PERCY_LOGLEVEL: debug
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Code Coverage Report For Develop Branch
        if: endsWith(github.ref, '/develop') || endsWith(github.ref, '/main')
        run: |
          echo "CODE_COVERAGE=true" >> "$GITHUB_ENV"
      - name: Install Dependencies
        working-directory: client
        run: npm install
      - name: Check and Install Cypress Binary
        run: |
          if npx cypress verify; then
            echo "Cypress is already installed."
          else
            echo "Cypress not found, installing..."
            npx cypress install --force
          fi
      - name: Ensure .ci/compose.cypress.yml exists in client
        run: |
          if [ ! -f client/.ci/compose.cypress.yml ] && [ -f .ci/compose.cypress.yml ]; then
            mkdir -p client/.ci
            cp .ci/compose.cypress.yml client/.ci/compose.cypress.yml
          fi
      - name: Setup Datareporter Server
        run: docker build -f .ci/Dockerfile.cypress -t cypress .
      - name: Setup Cypress Server
        working-directory: client
        run: |
          set -x
          npm run cypress build
          npm run cypress start -- --skip-db-seed
          docker compose run cypress npm run cypress db-seed
          sleep 10
      - name: Execute Cypress Tests
        working-directory: client
        run: npm run cypress run-ci
      - name: "Failure: output container logs to console"
        if: failure()
        run: docker compose -p cypress logs
      - name: send snapshots
        if: failure()
        run: docker cp cypress:/usr/src/app/client/cypress/screenshots ./snapshots || true
      - name: send snapshots results into percy
        if: failure()
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.PERCY_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "version": 1,
              "name": "Cypress Tests",
              "env": {
                "CYPRESS_RECORD_KEY": "${{ secrets.CYPRESS_RECORD_KEY }}",
                "CYPRESS_PROJECT_ID": "${{ secrets.CYPRESS_PROJECT_ID }}"
              },
              "snapshots": [
                {
                  "name": "snapshot",
                  "path": "./snapshots"
                }
              ]
            }' \
            https://percy.io/api/v1/projects/${{ secrets.PERCY_PROJECT_ID }}/snapshots
      - name: Copy Code Coverage Results
        run: docker cp cypress:/usr/src/app/coverage ./coverage || true
      - name: Store Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
