name: "Unit Tests"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, develop]
env:
  NODE_VERSION: 18
  NPM_VERSION: 9.5.1
  REDASH_COOKIE_SECRET: "${secrets.REDASH_COOKIE_SECRET}"

permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  restyled:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/restyled.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  backend-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m ensurepip --upgrade
      - run: sudo pip install black==23.1.0 ruff==0.0.287
      - run: ruff check .
      - run: black --check .
  backend-unit-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      COMPOSE_FILE: .ci/compose.ci.yml
      COMPOSE_PROJECT_NAME: server
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.12.1
      - name: Build docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev" --build-arg skip_frontend_build=true
          docker compose up -d
          sleep 10
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..30}; do
            if docker compose ps | grep postgres | grep -q "healthy"; then
              echo "Postgres is healthy."
              break
            fi
            echo "Waiting for Postgres to be healthy..."
            sleep 2
          done
      - name: Create Test Database
        run: docker compose -p server exec -T postgres psql -h localhost -U postgres -c "create database tests;"
      - name: List Enabled Query Runners
        run: docker compose -p server run --rm server manage ds list_types
      - name: Run Tests
        shell: bash
        run: |-
          docker compose  -p server run  --user 0 --name tests server tests --junitxml=junit.xml --cov-report=xml --cov=redash --cov-config=.coveragerc tests/
      - name: Copy Test Results
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Extract test results"
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Publish unit test report"
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          fail_on_failure: true
          report_paths: results.xml
          require_tests: true
          include_passed: true
          summary: true
          job_summary: true
          check_name: "Unit Tests Report"
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
  frontend-lint:
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: 'npm'
      - name: Install Dependencies
        working-directory: client
        run: npm install
      - name: Run Lint
        working-directory: client
        run: npm run lint
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: /tmp/test-results
  frontend-unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: Linux-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: Linux-node-
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install App dependencies
        working-directory: client
        run: npm install
      - name: List the state of node modules
        working-directory: client
        run: npm list
      - name: Build App
        working-directory: client
        run: npm run build
      - name: Run App Tests
        working-directory: client
        run: npm run test:coverage
      - name: Run Visualizations Tests
        working-directory: viz-lib
        run: npm run test
      - name: Install plywood-server dependencies
        working-directory: plywood
        run: npm install
      - name: Run plywood-server Tests
        working-directory: plywood
        run: npm run test
      - name: Install plywood-client dependencies
        working-directory: plywood/client
        run: npm install
      - name: Run plywood-client Tests
        working-directory: plywood/client
        run: npm run test
      - name: turnilo dependencies install
        working-directory: client/app/components/TurniloComponent
        run: npm install
      - name: turnilo client tests
        working-directory: client/app/components/TurniloComponent
        run: npm run test:client
      - name: turnilo common tests
        working-directory: client/app/components/TurniloComponent
        run: npm run test:common
  frontend-e2e-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, backend-unit-tests]
    env:
      COMPOSE_FILE: .ci/compose.cypress.yml
      COMPOSE_PROJECT_NAME: cypress
      # CYPRESS_INSTALL_BINARY: 0
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      COMPOSE_BAKE: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}  # Change from CYPRESS_PROJECT_ID
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      PERCY_PARALLEL_TOTAL: 1
      PERCY_PARALLEL_NONCE: ${{ github.run_id }}
      PERCY_PARALLEL: true
      PERCY_BRANCH: ${{ github.head_ref }}
      PERCY_COMMIT: ${{ github.sha }}
      PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
      COMMIT_INFO_BRANCH: ${{ github.head_ref }}
      COMMIT_INFO_MESSAGE: ${{ github.event.pull_request.title }}
      COMMIT_INFO_AUTHOR: ${{ github.event.pull_request.user.login }}
      COMMIT_INFO_SHA: ${{ github.sha }}
      PERCY_LOGLEVEL: debug
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          echo "After cleanup:"
          df -h
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Code Coverage Report For Develop Branch
        if: endsWith(github.ref, '/develop') || endsWith(github.ref, '/main')
        run: |
          echo "CODE_COVERAGE=true" >> "$GITHUB_ENV"
      - name: Install Dependencies
        working-directory: client
        run: |
          npm install
          npm install --save-dev @percy/cypress @percy/cli
      - name: Check and Install Cypress Binary
        run: |
          if npx cypress verify; then
            echo "Cypress is already installed."
          else
            echo "Cypress not found, installing..."
            npx cypress install --force
          fi
      - name: Ensure .ci/compose.cypress.yml exists in client
        run: |
          if [ ! -f client/.ci/compose.cypress.yml ] && [ -f .ci/compose.cypress.yml ]; then
            mkdir -p client/.ci
            cp .ci/compose.cypress.yml client/.ci/compose.cypress.yml
          fi
      - name: Setup Datareporter Server
        run: docker build -f .ci/Dockerfile.cypress -t cypress .
      - name: Setup Cypress via npm scripts
        working-directory: client
        run: |
          set -x
          npm run cypress build
          npm run cypress start -- --skip-db-seed
          docker compose run \
            -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e PERCY_COMMIT="${{ github.sha }}" \
            -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
            -e PERCY_PARALLEL_TOTAL=1 \
            -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
            -e PERCY_PARALLEL=true \
            -e PERCY_LOGLEVEL=debug \
            -e COMMIT_INFO_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e COMMIT_INFO_MESSAGE="${{ github.event.pull_request.title || github.event.head_commit.message }}" \
            -e COMMIT_INFO_AUTHOR="${{ github.event.pull_request.user.login || github.actor }}" \
            -e COMMIT_INFO_SHA="${{ github.sha }}" \
            cypress npm run cypress db-seed
          sleep 10
      - name: Execute Cypress Tests
        working-directory: client
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: |
          echo "🎯 Starting Cypress tests..."
          
          # Create directory for logs
          mkdir -p ../test-artifacts
          
          # Run Cypress directly (without Percy for now)
          set +e  # Don't exit on error
          
          docker compose run \
            -e CYPRESS_PROJECT_ID="${{ secrets.CYPRESS_PROJECT_ID }}" \
            -e CYPRESS_RECORD_KEY="${{ secrets.CYPRESS_RECORD_KEY }}" \
            -e CYPRESS_baseUrl="http://server:5000" \
            cypress \
            bash -c "
              echo '=== Starting Cypress Test Execution ===' 
              echo 'Current directory:' \$(pwd)
              echo 'Available test files:'
              find cypress/e2e -name '*.cy.js' | head -10
              echo ''
              echo '=== Running Cypress Tests ==='
              npx cypress run --reporter spec --browser chrome
              echo 'Cypress exit code:' \$?
              echo '=== Test Execution Complete ==='
            " 2>&1 | tee ../test-artifacts/cypress-logs.txt
          
          test_exit_code=${PIPESTATUS[0]}
          set -e  # Re-enable exit on error
          
          echo ""
          echo "📊 Test execution completed with exit code: $test_exit_code"
          echo ""
          echo "📋 Test output:"
          cat ../test-artifacts/cypress-logs.txt
          
          if [ $test_exit_code -eq 0 ]; then
            echo "✅ Tests passed"
          else
            echo "❌ Tests failed"
            exit 1
          fi
      - name: Show Cypress Test Results
        if: always()
        run: |
          echo "📊 Cypress Test Results Summary"
          echo "==============================="
          
          # Check if we have captured logs
          if [ -f test-artifacts/cypress-logs.txt ]; then
            echo "📋 Test results from captured logs:"
            
            # First, let's see what's actually in the log file
            echo ""
            echo "🔍 Raw log content (first 50 lines):"
            head -50 test-artifacts/cypress-logs.txt
            
            echo ""
            echo "🔍 Raw log content (last 50 lines):"
            tail -50 test-artifacts/cypress-logs.txt
            
            # Look for different Cypress indicators
            echo ""
            echo "🧪 Looking for Cypress test patterns:"
            
            # Try different patterns that Cypress might output
            echo "- Looking for 'cypress' keyword:"
            grep -i cypress test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for test file execution:"
            grep -E "\.(spec|test)\.js" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for test results:"
            grep -E "(√|✓|×|✗|pass|fail)" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for spec execution:"
            grep -i "spec" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for test completion:"
            grep -E "(All specs|tests completed|finished)" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for any numbers (test counts):"
            grep -E "[0-9]+" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            # Check if this might be percy output instead
            echo "- Looking for Percy output:"
            grep -i percy test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            # Check for npm run output
            echo "- Looking for npm run output:"
            grep -E "(npm|run)" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
          else
            echo "⚠️ No captured test logs found"
          fi

      - name: Capture Test Artifacts  
        if: always()
        working-directory: client
        run: |
          echo "📦 Capturing test artifacts..."
          
          # Ensure artifacts directory exists
          mkdir -p ../test-artifacts
          
          # Try to get artifacts from any cypress containers
          CONTAINER_NAMES=$(docker ps -a --filter "name=cypress" --format "{{.Names}}")
          
          if [ ! -z "$CONTAINER_NAMES" ]; then
            for CONTAINER_NAME in $CONTAINER_NAMES; do
              echo "Attempting to extract artifacts from: $CONTAINER_NAME"
              
              # Copy test artifacts (ignore errors if paths don't exist)
              docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/screenshots ../test-artifacts/ 2>/dev/null && echo "Screenshots copied" || echo "No screenshots found"
              docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/videos ../test-artifacts/ 2>/dev/null && echo "Videos copied" || echo "No videos found"
              docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/reports ../test-artifacts/ 2>/dev/null && echo "Reports copied" || echo "No reports found"
              
              # Only copy container logs if we don't already have captured logs
              if [ ! -f ../test-artifacts/cypress-logs.txt ]; then
                docker logs $CONTAINER_NAME > ../test-artifacts/cypress-container-logs.txt 2>&1 && echo "Container logs copied" || echo "No container logs"
              fi
            done
          else
            echo "No cypress containers available for artifact extraction"
          fi
          
          # Show what we captured
          echo "📋 Final captured artifacts:"
          find ../test-artifacts -type f 2>/dev/null | while read file; do
            size=$(du -h "$file" 2>/dev/null | cut -f1)
            echo "  $file ($size)"
          done || echo "No artifacts captured"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-artifacts/
          retention-days: 7

      - name: Analyze and Comment on Test Results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 🧪 E2E Test Results Analysis\n\n';
            let testsPassed = true;
            let totalTests = 0;
            let passCount = 0;
            let failCount = 0;
            
            try {
              const resultsDir = './test-artifacts';
              if (fs.existsSync(resultsDir)) {
                const logFile = path.join(resultsDir, 'cypress-logs.txt');
                if (fs.existsSync(logFile)) {
                  try {
                    const logContent = fs.readFileSync(logFile, 'utf8');
                    const lines = logContent.split('\n');
                    
                    // Strategy: Look for the overall test summary patterns
                    // Cypress outputs patterns like:
                    // - "X passing" / "X failing" for individual specs
                    // - "X of Y" patterns for overall results
                    // - Final stats summary
                    
                    let allSummaries = [];
                    let overallFailedPattern = null;
                    
                    // First pass: find all summary patterns
                    for (let i = lines.length - 1; i >= 0; i--) {
                      const line = lines[i];
                      
                      // Look for overall test result pattern: "X of Y failed" or "X passed"
                      const overallMatch = line.match(/(\d+)\s+of\s+(\d+)\s+failed/i);
                      if (overallMatch && !overallFailedPattern) {
                        overallFailedPattern = {
                          failed: parseInt(overallMatch[1]),
                          total: parseInt(overallMatch[2]),
                          line: line.trim()
                        };
                      }
                      
                      // Collect all "X passing/failing" lines
                      const passMatch = line.match(/(\d+)\s+passing/);
                      const failMatch = line.match(/(\d+)\s+failing/);
                      
                      if (passMatch || failMatch) {
                        allSummaries.push({
                          line: line.trim(),
                          pass: passMatch ? parseInt(passMatch[1]) : 0,
                          fail: failMatch ? parseInt(failMatch[1]) : 0,
                          index: i
                        });
                      }
                    }
                    
                    // Determine the actual final result
                    if (overallFailedPattern) {
                      // We have an overall failure pattern like "8 of 50 failed"
                      failCount = overallFailedPattern.failed;
                      totalTests = overallFailedPattern.total;
                      passCount = totalTests - failCount;
                    } else if (allSummaries.length > 0) {
                      // Use the LAST summary which should be the overall one
                      const lastSummary = allSummaries[allSummaries.length - 1];
                      passCount = lastSummary.pass;
                      failCount = lastSummary.fail;
                      totalTests = passCount + failCount;
                    }
                    
                    testsPassed = failCount === 0;
                    
                    // Build status section
                    comment += '### ';
                    if (testsPassed) {
                      comment += '✅ Test Status: PASSED\n\n';
                      if (totalTests > 0) {
                        comment += `**All ${totalTests} tests passed!**\n\n`;
                      }
                    } else {
                      comment += '❌ Test Status: FAILED\n\n';
                      if (totalTests > 0) {
                        comment += `**${failCount} of ${totalTests} tests failed** (${passCount} passed)\n\n`;
                      } else if (passCount > 0 || failCount > 0) {
                        comment += `**${failCount} test(s) failed**, ${passCount} test(s) passed\n\n`;
                      }
                    }
                    
                    // Show test statistics
                    comment += '**Test Statistics:**\n';
                    comment += `- 🎯 Total Tests: ${totalTests || 'Unknown'}\n`;
                    comment += `- ✅ Passed: ${passCount}\n`;
                    comment += `- ❌ Failed: ${failCount}\n`;
                    if (totalTests > 0) {
                      const passPercentage = Math.round((passCount / totalTests) * 100);
                      comment += `- 📊 Pass Rate: ${passPercentage}%\n`;
                    }
                    comment += '\n';
                    
                    // Extract and show failed spec files if any
                    if (failCount > 0) {
                      const failedSpecs = new Set();
                      
                      for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        // Look for lines that show failed specs: "Running: path/to/file.cy.js"
                        // followed by failures
                        const runningMatch = line.match(/Running:\s+(.+\.cy\.js)/);
                        if (runningMatch) {
                          // Check next lines for failures
                          for (let j = i + 1; j < Math.min(i + 50, lines.length); j++) {
                            if (lines[j].match(/\d+\s+failing/) || lines[j].includes('✖')) {
                              failedSpecs.add(runningMatch[1]);
                              break;
                            }
                          }
                        }
                      }
                      
                      if (failedSpecs.size > 0) {
                        comment += '**Failed Spec Files:**\n';
                        Array.from(failedSpecs).slice(0, 15).forEach((spec) => {
                          comment += `- 📄 ${spec}\n`;
                        });
                        if (failedSpecs.size > 15) {
                          comment += `- ... and ${failedSpecs.size - 15} more\n`;
                        }
                        comment += '\n';
                      }
                    }
                    
                  } catch (e) {
                    comment += `⚠️ Error parsing logs: ${e.message}\n\n`;
                  }
                } else {
                  comment += '⚠️ No Cypress logs found\n\n';
                }
                
                // Artifacts section
                comment += '**Test Artifacts:**\n';
                const videoDir = path.join(resultsDir, 'videos');
                const screenshotDir = path.join(resultsDir, 'screenshots');
                let videoCount = 0;
                let screenshotCount = 0;
                
                if (fs.existsSync(videoDir)) {
                  videoCount = fs.readdirSync(videoDir, { recursive: true })
                    .filter(file => file.endsWith('.mp4')).length;
                  if (videoCount > 0) {
                    comment += `- 🎥 ${videoCount} test video(s) recorded\n`;
                  }
                }
                
                if (fs.existsSync(screenshotDir)) {
                  screenshotCount = fs.readdirSync(screenshotDir, { recursive: true })
                    .filter(file => file.match(/\.(png|jpg|jpeg)$/)).length;
                  if (screenshotCount > 0) {
                    comment += `- 📸 ${screenshotCount} screenshot(s) captured\n`;
                  }
                }
                
                if (videoCount === 0 && screenshotCount === 0) {
                  comment += '- 📦 No additional artifacts captured\n';
                }
                
              } else {
                comment += '### ⚠️ No Test Artifacts Found\n';
                comment += 'Tests did not run or artifacts were not saved.\n';
              }
              
            } catch (error) {
              comment += `### ❌ Error Analyzing Results\n${error.message}\n`;
            }
            
            comment += '\n---\n*Generated from E2E test artifacts*';
            
            // Post comment to PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
  analyze-test-results:
    if: always() && github.event_name == 'pull_request'
    uses: ./.github/workflows/analyze-test-results.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    needs: frontend-e2e-tests