name: "Unit Tests"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, develop]
env:
  NODE_VERSION: 18
  NPM_VERSION: 9.5.1
  REDASH_COOKIE_SECRET: "${secrets.REDASH_COOKIE_SECRET}"

permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  restyled:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/restyled.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  backend-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m ensurepip --upgrade
      - run: sudo pip install black==23.1.0 ruff==0.0.287
      - run: ruff check .
      - run: black --check .
  backend-unit-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      COMPOSE_FILE: .ci/compose.ci.yml
      COMPOSE_PROJECT_NAME: server
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.12.1
      - name: Build docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev" --build-arg skip_frontend_build=true
          docker compose up -d
          sleep 10
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..30}; do
            if docker compose ps | grep postgres | grep -q "healthy"; then
              echo "Postgres is healthy."
              break
            fi
            echo "Waiting for Postgres to be healthy..."
            sleep 2
          done
      - name: Create Test Database
        run: docker compose -p server exec -T postgres psql -h localhost -U postgres -c "create database tests;"
      - name: List Enabled Query Runners
        run: docker compose -p server run --rm server manage ds list_types
      - name: Run Tests
        shell: bash
        run: |-
          docker compose  -p server run  --user 0 --name tests server tests --junitxml=junit.xml --cov-report=xml --cov=redash --cov-config=.coveragerc tests/
      - name: Copy Test Results
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Extract test results"
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Publish unit test report"
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          fail_on_failure: true
          report_paths: results.xml
          require_tests: true
          include_passed: true
          summary: true
          job_summary: true
          check_name: "Unit Tests Report"
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
  frontend-lint:
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: 'npm'
      - name: Install Dependencies
        working-directory: client
        run: npm install
      - name: Run Lint
        working-directory: client
        run: npm run lint
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: /tmp/test-results
  frontend-unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: Linux-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: Linux-node-
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install App dependencies
        working-directory: client
        run: npm install
      - name: List the state of node modules
        working-directory: client
        run: npm list
      - name: Build App
        working-directory: client
        run: npm run build
      - name: Run App Tests
        working-directory: client
        run: npm run test
      - name: Run Visualizations Tests
        working-directory: viz-lib
        run: npm run test
      - name: Install plywood-server dependencies
        working-directory: plywood
        run: npm install
      - name: Run plywood-server Tests
        working-directory: plywood
        run: npm run test
      - name: Install plywood-client dependencies
        working-directory: plywood/client
        run: npm install
      - name: Run plywood-client Tests
        working-directory: plywood/client
        run: npm run test
      - name: turnilo dependencies install
        working-directory: client/app/components/TurniloComponent
        run: npm install
      - name: turnilo client tests
        working-directory: client/app/components/TurniloComponent
        run: npm run test:client
      - name: turnilo common tests
        working-directory: client/app/components/TurniloComponent
        run: npm run test:common
  frontend-e2e-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend-unit-tests
    env:
      COMPOSE_FILE: .ci/compose.cypress.yml
      COMPOSE_PROJECT_NAME: cypress
      # CYPRESS_INSTALL_BINARY: 0
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      COMPOSE_BAKE: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}  # Change from CYPRESS_PROJECT_ID
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      PERCY_PARALLEL_TOTAL: 1
      PERCY_PARALLEL_NONCE: ${{ github.run_id }}
      PERCY_PARALLEL: true
      PERCY_BRANCH: ${{ github.head_ref }}
      PERCY_COMMIT: ${{ github.sha }}
      PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
      COMMIT_INFO_BRANCH: ${{ github.head_ref }}
      COMMIT_INFO_MESSAGE: ${{ github.event.pull_request.title }}
      COMMIT_INFO_AUTHOR: ${{ github.event.pull_request.user.login }}
      COMMIT_INFO_SHA: ${{ github.sha }}
      PERCY_LOGLEVEL: debug
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Code Coverage Report For Develop Branch
        if: endsWith(github.ref, '/develop') || endsWith(github.ref, '/main')
        run: |
          echo "CODE_COVERAGE=true" >> "$GITHUB_ENV"
      - name: Install Dependencies
        working-directory: client
        run: |
          npm install
          npm install --save-dev @percy/cypress @percy/cli
      - name: Check and Install Cypress Binary
        run: |
          if npx cypress verify; then
            echo "Cypress is already installed."
          else
            echo "Cypress not found, installing..."
            npx cypress install --force
          fi
      - name: Ensure .ci/compose.cypress.yml exists in client
        run: |
          if [ ! -f client/.ci/compose.cypress.yml ] && [ -f .ci/compose.cypress.yml ]; then
            mkdir -p client/.ci
            cp .ci/compose.cypress.yml client/.ci/compose.cypress.yml
          fi
      - name: Setup Datareporter Server
        run: docker build -f .ci/Dockerfile.cypress -t cypress .
      - name: Setup Cypress Server
        working-directory: client
        run: |
          set -x
          npm run cypress build
          npm run cypress start -- --skip-db-seed
          docker compose run \
            -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e PERCY_COMMIT="${{ github.sha }}" \
            -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
            -e PERCY_PARALLEL_TOTAL=1 \
            -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
            -e PERCY_PARALLEL=true \
            -e PERCY_LOGLEVEL=debug \
            -e COMMIT_INFO_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e COMMIT_INFO_MESSAGE="${{ github.event.pull_request.title || github.event.head_commit.message }}" \
            -e COMMIT_INFO_AUTHOR="${{ github.event.pull_request.user.login || github.actor }}" \
            -e COMMIT_INFO_SHA="${{ github.sha }}" \
            cypress npm run cypress db-seed
          sleep 10
      - name: Execute Cypress Tests
        working-directory: client
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_COMMIT: ${{ github.sha }}
          PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
          PERCY_PARALLEL_TOTAL: 1
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}
          PERCY_PARALLEL: true
          PERCY_LOGLEVEL: debug
        run: |
          # Retry logic for flaky tests with detailed output
          attempt=1
          max_attempts=3
          
          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Attempt $attempt of $max_attempts"
            echo "==========================================="
            
            # Clean up any existing containers before retry
            if [ $attempt -gt 1 ]; then
              echo "🧹 Cleaning up containers from previous attempt..."
              docker compose -p cypress down --remove-orphans || true
              docker system prune -f || true
              sleep 10
              
              # Restart services
              echo "🚀 Restarting services..."
              npm run cypress start -- --skip-db-seed
              docker compose run cypress npm run cypress db-seed
              sleep 10
            fi
            
            # Run the actual test with output capture
            echo "🎯 Starting Cypress tests..."
            set +e  # Don't exit on error
            
            docker compose run \
              -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
              -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
              -e PERCY_COMMIT="${{ github.sha }}" \
              -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
              -e PERCY_PARALLEL_TOTAL=1 \
              -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
              -e PERCY_PARALLEL=true \
              -e PERCY_LOGLEVEL=debug \
              cypress percy exec -- npm run cypress run
            
            test_exit_code=$?
            set -e  # Re-enable exit on error
            
            if [ $test_exit_code -eq 0 ]; then
              echo ""
              echo "✅ Tests passed on attempt $attempt"
              echo "==========================================="
              break
            else
              echo ""
              echo "❌ Tests failed on attempt $attempt (exit code: $test_exit_code)"
              echo "==========================================="
              
              if [ $attempt -eq $max_attempts ]; then
                echo "💥 All attempts failed"
                exit 1
              fi
              
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
              ((attempt++))
            fi
          done

      - name: Show Cypress Test Results
        if: always()
        run: |
          echo "📊 Cypress Test Results Summary"
          echo "==============================="
          
          # Get test results from cypress container
          if docker ps -a --filter "name=cypress" --format "table {{.Names}}" | grep -q cypress; then
            echo "📋 Extracting test results from container..."
            
            # Get the actual container name
            CONTAINER_NAME=$(docker ps -a --filter "name=cypress" --format "{{.Names}}" | head -1)
            echo "Using container: $CONTAINER_NAME"
            
            # Get test results
            echo ""
            echo "🧪 Test Results:"
            docker logs $CONTAINER_NAME 2>&1 | grep -E "(Running|✓|✗|passing|failing|Spec.*\.js)" | tail -30 || echo "No test results found"
            
            # Get any error messages
            echo ""
            echo "🚨 Error Messages:"
            docker logs $CONTAINER_NAME 2>&1 | grep -i "error\|failed\|timeout" | tail -10 || echo "No errors found"
            
            # Get Percy snapshot info
            echo ""
            echo "📸 Percy Snapshot Info:"
            docker logs $CONTAINER_NAME 2>&1 | grep -i percy | tail -10 || echo "No Percy info found"
            
            # Get test summary
            echo ""
            echo "📈 Test Summary:"
            docker logs $CONTAINER_NAME 2>&1 | grep -E "([0-9]+ passing|[0-9]+ failing|All specs passed)" | tail -5 || echo "No summary found"
            
          else
            echo "⚠️ No cypress container found"
            echo "Available containers:"
            docker ps -a --format "table {{.Names}}\t{{.Status}}"
          fi

      - name: Capture Test Artifacts  
        if: always()
        working-directory: client
        run: |
          echo "📦 Capturing test artifacts..."
          
          # Create artifacts directory
          mkdir -p ../test-artifacts
          
          # Get container name
          CONTAINER_NAME=$(docker ps -a --filter "name=cypress" --format "{{.Names}}" | head -1)
          
          if [ ! -z "$CONTAINER_NAME" ]; then
            echo "Extracting artifacts from container: $CONTAINER_NAME"
            
            # Copy test artifacts
            docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/screenshots ../test-artifacts/ 2>/dev/null || echo "No screenshots found"
            docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/videos ../test-artifacts/ 2>/dev/null || echo "No videos found"  
            docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/reports ../test-artifacts/ 2>/dev/null || echo "No reports found"
            
            # Try to get test results/logs
            docker logs $CONTAINER_NAME > ../test-artifacts/cypress-logs.txt 2>&1 || echo "Could not capture logs"
            
            # Show what we captured
            echo "📋 Captured artifacts:"
            find ../test-artifacts -type f 2>/dev/null | head -20 || echo "No artifacts captured"
          else
            echo "No cypress container available for artifact extraction"
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-artifacts-${{ github.run_id }}
          path: test-artifacts/
          retention-days: 7

      - name: "Failure: output container logs to console"
        if: failure()
        run: docker compose -p cypress logs
      - name: send snapshots
        if: failure()
        run: docker cp cypress:/usr/src/app/client/cypress/screenshots ./snapshots || true
      - name: Copy Code Coverage Results
        run: docker cp cypress:/usr/src/app/coverage ./coverage || true
      - name: Store Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Debug Percy Environment
        run: |
          echo "PERCY_TOKEN exists: ${{ secrets.PERCY_TOKEN != '' }}"
          echo "PERCY_PROJECT exists: ${{ secrets.CYPRESS_PROJECT_ID != '' }}"
          echo "PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}"
      - name: Test Docker container lifecycle in retry logic
        run: |
          python3 -c "
          import yaml
        
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              workflow = yaml.safe_load(f)
        
          e2e_job = workflow['jobs']['frontend-e2e-tests']
          cypress_step = next((step for step in e2e_job['steps'] if 'Execute Cypress Tests' in step.get('name', '')), None)
        
          if cypress_step:
              run_script = cypress_step['run']
              
              # Check for Docker cleanup in retry logic
              if 'docker compose down' not in run_script:
                  print('⚠️  WARNING: Retry logic missing container cleanup')
                  print('   This may cause \"docker not found\" errors on retry attempts')
                  print('   Recommendation: Add cleanup between retry attempts')
              else:
                  print('✅ Docker cleanup found in retry logic')
          "
  analyze-test-results:
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [backend-unit-tests, frontend-unit-tests, frontend-e2e-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./test-results
        continue-on-error: true
      
      - name: Analyze test patterns
        run: |
          python3 -c "
          import os
          from pathlib import Path
          
          results_dir = Path('./test-results')
          
          if results_dir.exists():
              print('📊 Downloaded Test Artifacts Analysis')
              print('=' * 50)
              
              # Show what we downloaded
              for artifact in results_dir.rglob('*'):
                  if artifact.is_file():
                      size_kb = artifact.stat().st_size // 1024
                      print(f'📁 {artifact.relative_to(results_dir)} ({size_kb}KB)')
              
              # Look for failure indicators
              cypress_logs = list(results_dir.glob('**/cypress-logs.txt'))
              if cypress_logs:
                  print(f'\\n🔍 Found Cypress logs: {len(cypress_logs)} file(s)')
                  for log_file in cypress_logs:
                   