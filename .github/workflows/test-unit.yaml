name: "Unit Tests"
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, develop]
env:
  NODE_VERSION: 18
  NPM_VERSION: 9.5.1
  REDASH_COOKIE_SECRET: "${secrets.REDASH_COOKIE_SECRET}"

permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  restyled:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/restyled.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  backend-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m ensurepip --upgrade
      - run: sudo pip install black==23.1.0 ruff==0.0.287
      - run: ruff check .
      - run: black --check .
  backend-unit-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      COMPOSE_FILE: .ci/compose.ci.yml
      COMPOSE_PROJECT_NAME: server
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.12.1
      - name: Build docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev" --build-arg skip_frontend_build=true
          docker compose up -d
          sleep 10
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..30}; do
            if docker compose ps | grep postgres | grep -q "healthy"; then
              echo "Postgres is healthy."
              break
            fi
            echo "Waiting for Postgres to be healthy..."
            sleep 2
          done
      - name: Create Test Database
        run: docker compose -p server exec -T postgres psql -h localhost -U postgres -c "create database tests;"
      - name: List Enabled Query Runners
        run: docker compose -p server run --rm server manage ds list_types
      - name: Run Tests
        shell: bash
        run: |-
          docker compose  -p server run  --user 0 --name tests server tests --junitxml=junit.xml --cov-report=xml --cov=redash --cov-config=.coveragerc tests/
      - name: Copy Test Results
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Extract test results"
        shell: bash
        if: always()
        run: |
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml ./results.xml
          ls -l
      - name: "Publish unit test report"
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          fail_on_failure: true
          report_paths: results.xml
          require_tests: true
          include_passed: true
          summary: true
          job_summary: true
          check_name: "Unit Tests Report"
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
  frontend-lint:
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: restyled
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: 'npm'
      - name: Install Dependencies
        working-directory: client
        run: npm install
      - name: Run Lint
        working-directory: client
        run: npm run lint
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: /tmp/test-results
  frontend-unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: Linux-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: Linux-node-
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install App dependencies
        working-directory: client
        run: npm install
      - name: List the state of node modules
        working-directory: client
        run: npm list
      - name: Build App
        working-directory: client
        run: npm run build
      - name: Run App Tests
        working-directory: client
        run: npm run test
      - name: Run Visualizations Tests
        working-directory: viz-lib
        run: npm run test
      - name: Install plywood-server dependencies
        working-directory: plywood
        run: npm install
      - name: Run plywood-server Tests
        working-directory: plywood
        run: npm run test
      - name: Install plywood-client dependencies
        working-directory: plywood/client
        run: npm install
      - name: Run plywood-client Tests
        working-directory: plywood/client
        run: npm run test
      - name: turnilo dependencies install
        working-directory: client/app/components/TurniloComponent
        run: npm install
      - name: turnilo client tests
        working-directory: client/app/components/TurniloComponent
        run: npm run test:client
      - name: turnilo common tests
        working-directory: client/app/components/TurniloComponent
        run: npm run test:common
  frontend-e2e-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, backend-unit-tests]
    env:
      COMPOSE_FILE: .ci/compose.cypress.yml
      COMPOSE_PROJECT_NAME: cypress
      # CYPRESS_INSTALL_BINARY: 0
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      COMPOSE_BAKE: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}  # Change from CYPRESS_PROJECT_ID
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      PERCY_PARALLEL_TOTAL: 1
      PERCY_PARALLEL_NONCE: ${{ github.run_id }}
      PERCY_PARALLEL: true
      PERCY_BRANCH: ${{ github.head_ref }}
      PERCY_COMMIT: ${{ github.sha }}
      PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
      COMMIT_INFO_BRANCH: ${{ github.head_ref }}
      COMMIT_INFO_MESSAGE: ${{ github.event.pull_request.title }}
      COMMIT_INFO_AUTHOR: ${{ github.event.pull_request.user.login }}
      COMMIT_INFO_SHA: ${{ github.sha }}
      PERCY_LOGLEVEL: debug
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Code Coverage Report For Develop Branch
        if: endsWith(github.ref, '/develop') || endsWith(github.ref, '/main')
        run: |
          echo "CODE_COVERAGE=true" >> "$GITHUB_ENV"
      - name: Install Dependencies
        working-directory: client
        run: |
          npm install
          npm install --save-dev @percy/cypress @percy/cli
      - name: Check and Install Cypress Binary
        run: |
          if npx cypress verify; then
            echo "Cypress is already installed."
          else
            echo "Cypress not found, installing..."
            npx cypress install --force
          fi
      - name: Ensure .ci/compose.cypress.yml exists in client
        run: |
          if [ ! -f client/.ci/compose.cypress.yml ] && [ -f .ci/compose.cypress.yml ]; then
            mkdir -p client/.ci
            cp .ci/compose.cypress.yml client/.ci/compose.cypress.yml
          fi
      - name: Setup Datareporter Server
        run: docker build -f .ci/Dockerfile.cypress -t cypress .
      - name: Setup Cypress Server
        working-directory: client
        run: |
          set -x
          npm run cypress build
          npm run cypress start -- --skip-db-seed
          docker compose run \
            -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e PERCY_COMMIT="${{ github.sha }}" \
            -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
            -e PERCY_PARALLEL_TOTAL=1 \
            -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
            -e PERCY_PARALLEL=true \
            -e PERCY_LOGLEVEL=debug \
            -e COMMIT_INFO_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e COMMIT_INFO_MESSAGE="${{ github.event.pull_request.title || github.event.head_commit.message }}" \
            -e COMMIT_INFO_AUTHOR="${{ github.event.pull_request.user.login || github.actor }}" \
            -e COMMIT_INFO_SHA="${{ github.sha }}" \
            cypress npm run cypress db-seed
          sleep 10
      - name: Execute Cypress Tests
        working-directory: client
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_COMMIT: ${{ github.sha }}
          PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
          PERCY_PARALLEL_TOTAL: 1
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}
          PERCY_PARALLEL: true
          PERCY_LOGLEVEL: debug
        run: |
          # Retry logic for flaky tests with detailed output
          attempt=1
          max_attempts=3
          
          # Create directory for logs
          mkdir -p ../test-artifacts
          
          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Attempt $attempt of $max_attempts"
            echo "==========================================="
            
            # Clean up any existing containers before retry
            if [ $attempt -gt 1 ]; then
              echo "🧹 Cleaning up containers from previous attempt..."
              docker compose -p cypress down --remove-orphans || true
              docker system prune -f || true
              sleep 10
              
              # Restart services
              echo "🚀 Restarting services..."
              npm run cypress start -- --skip-db-seed
              docker compose run cypress npm run cypress db-seed
              sleep 10
            fi
            
            # Run the test with proper logging
            echo "🎯 Starting Cypress tests..."
            set +e  # Don't exit on error
            
            # Run the command and capture both stdout and stderr
            echo "Executing: docker compose run cypress percy exec -- npm run cypress run"
            
            # Use a different approach - run command in background and capture logs
            CONTAINER_NAME="cypress-test-${attempt}-$(date +%s)"
            
            # Start the container with logging
            docker compose run \
              --name "$CONTAINER_NAME" \
              -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
              -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
              -e PERCY_COMMIT="${{ github.sha }}" \
              -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
              -e PERCY_PARALLEL_TOTAL=1 \
              -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
              -e PERCY_PARALLEL=true \
              -e PERCY_LOGLEVEL=debug \
              cypress \
              bash -c "
                echo '=== Starting Cypress Test Execution ===' 
                echo 'Current directory:' \$(pwd)
                echo 'Node version:' \$(node --version)
                echo 'NPM version:' \$(npm --version)
                echo 'Cypress binary:' \$(npx cypress version || echo 'Cypress not found')
                echo 'Percy version:' \$(npx percy --version || echo 'Percy not found')
                echo 'Available scripts:'
                npm run | grep cypress || echo 'No cypress scripts found'
                echo ''
                echo '=== Environment Variables ==='
                env | grep -E '(PERCY|CYPRESS)' | sort
                echo ''
                echo '=== Running Percy + Cypress ==='
                percy exec -- npm run cypress run
                echo 'Exit code:' \$?
                echo '=== Test Execution Complete ==='
              " 2>&1 | tee ../test-artifacts/cypress-logs-attempt-${attempt}.txt
            
            test_exit_code=${PIPESTATUS[0]}
            set -e  # Re-enable exit on error
            
            # Show immediate feedback
            echo ""
            echo "📊 Test execution completed with exit code: $test_exit_code"
            echo ""
            echo "📋 Captured output preview:"
            echo "--- First 30 lines ---"
            head -30 ../test-artifacts/cypress-logs-attempt-${attempt}.txt || echo "No output captured"
            echo ""
            echo "--- Last 30 lines ---"
            tail -30 ../test-artifacts/cypress-logs-attempt-${attempt}.txt || echo "No output captured"
            
            if [ $test_exit_code -eq 0 ]; then
              echo ""
              echo "✅ Tests passed on attempt $attempt"
              echo "==========================================="
              
              # Copy the successful log
              cp ../test-artifacts/cypress-logs-attempt-${attempt}.txt ../test-artifacts/cypress-logs.txt
              break
            else
              echo ""
              echo "❌ Tests failed on attempt $attempt (exit code: $test_exit_code)"
              echo "==========================================="
              
              # Show error analysis
              echo "🔍 Error analysis from attempt $attempt:"
              grep -i -E "(error|failed|timeout|exception)" ../test-artifacts/cypress-logs-attempt-${attempt}.txt | head -10 || echo "No errors found in output"
              
              if [ $attempt -eq $max_attempts ]; then
                echo "💥 All attempts failed"
                echo "==========================================="
                
                # Combine all logs
                echo "=== COMBINED LOGS FROM ALL ATTEMPTS ===" > ../test-artifacts/cypress-logs.txt
                for i in $(seq 1 $attempt); do
                  if [ -f ../test-artifacts/cypress-logs-attempt-${i}.txt ]; then
                    echo "" >> ../test-artifacts/cypress-logs.txt
                    echo "=== ATTEMPT $i ===" >> ../test-artifacts/cypress-logs.txt
                    cat ../test-artifacts/cypress-logs-attempt-${i}.txt >> ../test-artifacts/cypress-logs.txt
                  fi
                done
                
                echo ""
                echo "📋 Final summary from all attempts:"
                grep -E "(Starting Cypress|Test Execution Complete|Exit code|percy|cypress)" ../test-artifacts/cypress-logs.txt | tail -20 || echo "No summary available"
                
                exit 1
              fi
              
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
              ((attempt++))
            fi
            
            # Clean up container
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
          done

      - name: Show Cypress Test Results
        if: always()
        run: |
          echo "📊 Cypress Test Results Summary"
          echo "==============================="
          
          # Check if we have captured logs
          if [ -f test-artifacts/cypress-logs.txt ]; then
            echo "📋 Test results from captured logs:"
            
            # First, let's see what's actually in the log file
            echo ""
            echo "🔍 Raw log content (first 50 lines):"
            head -50 test-artifacts/cypress-logs.txt
            
            echo ""
            echo "🔍 Raw log content (last 50 lines):"
            tail -50 test-artifacts/cypress-logs.txt
            
            # Look for different Cypress indicators
            echo ""
            echo "🧪 Looking for Cypress test patterns:"
            
            # Try different patterns that Cypress might output
            echo "- Looking for 'cypress' keyword:"
            grep -i cypress test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for test file execution:"
            grep -E "\.(spec|test)\.js" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for test results:"
            grep -E "(√|✓|×|✗|pass|fail)" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for spec execution:"
            grep -i "spec" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for test completion:"
            grep -E "(All specs|tests completed|finished)" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            echo "- Looking for any numbers (test counts):"
            grep -E "[0-9]+" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            # Check if this might be percy output instead
            echo "- Looking for Percy output:"
            grep -i percy test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
            # Check for npm run output
            echo "- Looking for npm run output:"
            grep -E "(npm|run)" test-artifacts/cypress-logs.txt | head -10 || echo "  None found"
            
          else
            echo "⚠️ No captured test logs found"
          fi

      - name: Capture Test Artifacts  
        if: always()
        working-directory: client
        run: |
          echo "📦 Capturing test artifacts..."
          
          # Ensure artifacts directory exists
          mkdir -p ../test-artifacts
          
          # Try to get artifacts from any cypress containers
          CONTAINER_NAMES=$(docker ps -a --filter "name=cypress" --format "{{.Names}}")
          
          if [ ! -z "$CONTAINER_NAMES" ]; then
            for CONTAINER_NAME in $CONTAINER_NAMES; do
              echo "Attempting to extract artifacts from: $CONTAINER_NAME"
              
              # Copy test artifacts (ignore errors if paths don't exist)
              docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/screenshots ../test-artifacts/ 2>/dev/null && echo "Screenshots copied" || echo "No screenshots found"
              docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/videos ../test-artifacts/ 2>/dev/null && echo "Videos copied" || echo "No videos found"
              docker cp $CONTAINER_NAME:/usr/src/app/client/cypress/reports ../test-artifacts/ 2>/dev/null && echo "Reports copied" || echo "No reports found"
              
              # Only copy container logs if we don't already have captured logs
              if [ ! -f ../test-artifacts/cypress-logs.txt ]; then
                docker logs $CONTAINER_NAME > ../test-artifacts/cypress-container-logs.txt 2>&1 && echo "Container logs copied" || echo "No container logs"
              fi
            done
          else
            echo "No cypress containers available for artifact extraction"
          fi
          
          # Show what we captured
          echo "📋 Final captured artifacts:"
          find ../test-artifacts -type f 2>/dev/null | while read file; do
            size=$(du -h "$file" 2>/dev/null | cut -f1)
            echo "  $file ($size)"
          done || echo "No artifacts captured"
  frontend-e2e-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, backend-unit-tests]
    env:
      COMPOSE_FILE: .ci/compose.cypress.yml
      COMPOSE_PROJECT_NAME: cypress
      # CYPRESS_INSTALL_BINARY: 0
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      COMPOSE_BAKE: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}  # Change from CYPRESS_PROJECT_ID
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      PERCY_PARALLEL_TOTAL: 1
      PERCY_PARALLEL_NONCE: ${{ github.run_id }}
      PERCY_PARALLEL: true
      PERCY_BRANCH: ${{ github.head_ref }}
      PERCY_COMMIT: ${{ github.sha }}
      PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
      COMMIT_INFO_BRANCH: ${{ github.head_ref }}
      COMMIT_INFO_MESSAGE: ${{ github.event.pull_request.title }}
      COMMIT_INFO_AUTHOR: ${{ github.event.pull_request.user.login }}
      COMMIT_INFO_SHA: ${{ github.sha }}
      PERCY_LOGLEVEL: debug
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Code Coverage Report For Develop Branch
        if: endsWith(github.ref, '/develop') || endsWith(github.ref, '/main')
        run: |
          echo "CODE_COVERAGE=true" >> "$GITHUB_ENV"
      - name: Install Dependencies
        working-directory: client
        run: |
          npm install
          npm install --save-dev @percy/cypress @percy/cli
      - name: Check and Install Cypress Binary
        run: |
          if npx cypress verify; then
            echo "Cypress is already installed."
          else
            echo "Cypress not found, installing..."
            npx cypress install --force
          fi
      - name: Ensure .ci/compose.cypress.yml exists in client
        run: |
          if [ ! -f client/.ci/compose.cypress.yml ] && [ -f .ci/compose.cypress.yml ]; then
            mkdir -p client/.ci
            cp .ci/compose.cypress.yml client/.ci/compose.cypress.yml
          fi
      - name: Setup Datareporter Server
        run: docker build -f .ci/Dockerfile.cypress -t cypress .
      - name: Setup Cypress Server
        working-directory: client
        run: |
          set -x
          npm run cypress build
          npm run cypress start -- --skip-db-seed
          docker compose run \
            -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e PERCY_COMMIT="${{ github.sha }}" \
            -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
            -e PERCY_PARALLEL_TOTAL=1 \
            -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
            -e PERCY_PARALLEL=true \
            -e PERCY_LOGLEVEL=debug \
            -e COMMIT_INFO_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e COMMIT_INFO_MESSAGE="${{ github.event.pull_request.title || github.event.head_commit.message }}" \
            -e COMMIT_INFO_AUTHOR="${{ github.event.pull_request.user.login || github.actor }}" \
            -e COMMIT_INFO_SHA="${{ github.sha }}" \
            cypress npm run cypress db-seed
          sleep 10
      - name: Execute Cypress Tests (Debug Failure Mode)
        working-directory: client
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_COMMIT: ${{ github.sha }}
          PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
          PERCY_PARALLEL_TOTAL: 1
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}
          PERCY_PARALLEL: true
          PERCY_LOGLEVEL: debug
        run: |
          echo "🎯 Running FAILING tests to test error reporting..."
          
          # Create directory for logs
          mkdir -p ../test-artifacts
          
          # Run only the debug test (which will fail)
          set +e  # Don't exit on error
          
          docker compose run \
            -e PERCY_TOKEN="${{ secrets.PERCY_TOKEN }}" \
            -e PERCY_BRANCH="${{ github.head_ref || github.ref_name }}" \
            -e PERCY_COMMIT="${{ github.sha }}" \
            -e PERCY_PULL_REQUEST="${{ github.event.pull_request.number }}" \
            -e PERCY_PARALLEL_TOTAL=1 \
            -e PERCY_PARALLEL_NONCE="${{ github.run_id }}" \
            -e PERCY_PARALLEL=true \
            -e PERCY_LOGLEVEL=debug \
            cypress \
            bash -c "
              echo '=== Starting INTENTIONAL FAILURE Test ===' 
              echo 'Current directory:' \$(pwd)
              echo 'Node version:' \$(node --version)
              echo 'Cypress version:' \$(npx cypress version)
              echo ''
              echo '=== Running FAILING test specifically ==='
              npx cypress run --spec 'cypress/e2e/debug/debug_failure_test.cy.js' --reporter spec
              echo 'Exit code:' \$?
              echo '=== Test Execution Complete ==='
            " 2>&1 | tee ../test-artifacts/cypress-failure-logs.txt
          
          test_exit_code=${PIPESTATUS[0]}
          set -e  # Re-enable exit on error
          
          echo ""
          echo "📊 FAILURE Test completed with exit code: $test_exit_code"
          echo ""
          echo "📋 Full captured output:"
          cat ../test-artifacts/cypress-failure-logs.txt
          
          echo ""
          echo "🔍 Looking for failure indicators:"
          grep -i -E "(fail|error|timeout|✗|×)" ../test-artifacts/cypress-failure-logs.txt || echo "No failure indicators found"
          
          echo ""
          echo "🔍 Looking for test results:"
          grep -E "([0-9]+ failing|[0-9]+ passing)" ../test-artifacts/cypress-failure-logs.txt || echo "No test counts found"
          
          # Don't exit with failure - we want to see the output
          echo "⚠️ Expected failure test completed - continuing to see results"
      - name: Restore Original Test Files
        if: always()
        working-directory: client
        run: |
          echo "🧹 Restoring original test files..."
          
          # Remove debug test
          rm -f cypress/e2e/debug/debug_failure_test.cy.js
          rmdir cypress/e2e/debug 2>/dev/null || true
          
          # Restore any backed up files
          find cypress/e2e -name "*.cy.js.backup" | while read backup; do
            original="${backup%.backup}"
            mv "$backup" "$original"
            echo "Restored $original"
          done
  analyze-test-results:
    if: always() && github.event_name == 'pull_request'
    uses: ./.github/workflows/analyze-test-results.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    needs: [frontend-e2e-tests, frontend-e2e-debug]