enabled: true

auto: false

# Open Restyle PRs?
pull_requests: true

# Leave comments on the original PR linking to the Restyle PR?
comments: true

# Set commit statuses on the original PR?
statuses:
  # Red status in the case of differences found
  differences: true
  # Green status in the case of no differences found
  no_differences: true
  # Red status if we encounter errors restyling
  error: true

# Request review on the Restyle PR?
request_review: author

# Add labels to any created Restyle PRs
labels:
  - restyled
  - "Skip CI"

# Labels to ignore
# ignore_labels:
#   - restyled-ignore

# Restylers to run, and how
restylers:
  - name: black
    image: restyled/restyler-black:v24.4.2
    include:
      - redash
      - tests
      - migrations/versions
  - name: prettier
    image: restyled/restyler-prettier:v3.3.2-2
    command:
      - prettier
      - --write
      - --arrow-parens
      - avoid
      - --single-quote
      - "false"
      - --trailing-comma
      - all
      - --quote-props
      - consistent
    include:
      - client/app/**/*.js
      - client/app/**/*.jsx
      - client/cypress/**/*.js
      - plywood/**/*.js
      - plywood/**/*.ts
