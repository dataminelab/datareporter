name: "Enhanced Unit Tests Workflow"

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test-unit.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test-unit.yaml'

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

env:
  NODE_VERSION: '18'
  NPM_VERSION: '9'
  REDASH_COOKIE_SECRET: ${{ secrets.REDASH_COOKIE_SECRET }}

jobs:
  workflow-self-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate workflow syntax
        run: |
          python3 -c "
          import yaml
          with open('.github/workflows/test-unit.yaml', 'r') as f:
              yaml.safe_load(f)
          print('✅ Workflow YAML is valid')
          "

  restyled:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: workflow-self-test
    steps:
      - uses: actions/checkout@v4
      - uses: restyled-io/actions/setup@v4
      - uses: restyled-io/actions/run@v4

  backend-lint:
    runs-on: ubuntu-latest
    needs: workflow-self-test
    timeout-minutes: 5
    steps:
      - name: Check PR mergeability
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.mergeable }}" == "false" ]]; then
            echo "❌ PR is not mergeable"
            exit 1
          fi
          
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          
      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .
          isort --check-only .

  backend-unit-tests:
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.yml:.ci/compose.test.yml
      COMPOSE_PROJECT_NAME: server-${{ github.run_id }}
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - name: Check PR mergeability
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.mergeable }}" == "false" ]]; then
            echo "❌ PR is not mergeable"
            exit 1
          fi
          
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Run backend tests with retry
        run: |
          attempt=1
          max_attempts=2
          
          while [ $attempt -le $max_attempts ]; do
            echo "🚀 Attempt $attempt of $max_attempts"
            
            if docker compose up -d --build && \
               docker compose exec -T server pytest tests/ --junitxml=test-results.xml --cov=. --cov-report=xml; then
              echo "✅ Tests passed on attempt $attempt"
              break
            fi
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ All attempts failed"
              exit 1
            fi
            
            echo "⚠️ Attempt $attempt failed, cleaning up..."
            docker compose down --volumes --remove-orphans
            sleep 10
            ((attempt++))
          done
          
      - name: Extract test results
        if: always()
        run: |
          docker compose cp server:/app/test-results.xml ./test-results.xml
          docker compose cp server:/app/coverage.xml ./coverage.xml
          
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
        
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: test-results.xml
          reporter: java-junit
          
      - uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

  frontend-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: restyled
    timeout-minutes: 60
    steps:
      - name: Check PR mergeability
        run: |
          if [[ "${{ github.event.pull_request.mergeable }}" == "false" ]]; then
            echo "❌ PR is not mergeable"
            exit 1
          fi
          
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Run Prettier check
        run: npm run format:check

  frontend-unit-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: frontend-lint
    steps:
      - name: Check PR mergeability
        run: |
          if [[ "${{ github.event.pull_request.mergeable }}" == "false" ]]; then
            echo "❌ PR is not mergeable"
            exit 1
          fi
          
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm test -- --coverage --watchAll=false --testResultsProcessor=jest-junit
        
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Test Results
          path: junit.xml
          reporter: java-junit

  frontend-e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: frontend-lint
    env:
      COMPOSE_FILE: docker-compose.yml:.ci/compose.cypress.yml
      COMPOSE_PROJECT_NAME: cypress-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}
      PERCY_PARALLEL_TOTAL: 4
      PERCY_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      PERCY_PARALLEL: true
      PERCY_BRANCH: ${{ github.head_ref }}
      PERCY_COMMIT: ${{ github.event.pull_request.head.sha }}
      PERCY_PULL_REQUEST: ${{ github.event.number }}
      PERCY_LOGLEVEL: debug
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
    steps:
      - name: Check PR mergeability
        run: |
          if [[ "${{ github.event.pull_request.mergeable }}" == "false" ]]; then
            echo "❌ PR is not mergeable"
            exit 1
          fi
          
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Setup application with health checks
        run: |
          echo "🚀 Starting application services..."
          docker compose up -d --build
          
          echo "⏳ Waiting for services to be healthy..."
          for i in {1..60}; do
            if docker compose ps | grep -q "healthy"; then
              echo "✅ Services are healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Services failed to become healthy"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          
          echo "🔍 Checking API connectivity..."
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5000/api/health
          
      - name: Execute Cypress Tests
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_PROJECT: ${{ secrets.CYPRESS_PROJECT_ID }}
          PERCY_PARALLEL_TOTAL: 4
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          attempt=1
          max_attempts=3
          
          while [ $attempt -le $max_attempts ]; do
            echo "🧪 E2E Test Attempt $attempt of $max_attempts"
            
            # Clean up any existing state
            if [ $attempt -gt 1 ]; then
              echo "🧹 Cleaning up previous attempt..."
              docker compose down --volumes --remove-orphans || true
              docker system prune -f || true
              sleep 30
              
              echo "🚀 Restarting services..."
              docker compose up -d --build
              
              # Wait for health check again
              for i in {1..30}; do
                if docker compose ps | grep -q "healthy"; then
                  break
                fi
                sleep 2
              done
            fi
            
            # Run tests
            if docker compose run --rm cypress percy exec -- cypress run \
                 --record --key ${{ secrets.CYPRESS_RECORD_KEY }} \
                 --parallel --ci-build-id ${{ github.run_id }}-${{ github.run_attempt }}; then
              echo "✅ E2E tests passed on attempt $attempt"
              break
            fi
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ All E2E test attempts failed"
              echo "📋 Collecting failure artifacts..."
              docker compose logs > docker-logs.txt
              exit 1
            fi
            
            ((attempt++))
            echo "⚠️ Attempt failed, retrying in 30 seconds..."
            sleep 30
          done
          
      - name: Collect failure artifacts
        if: failure()
        run: |
          mkdir -p cypress-artifacts
          docker compose logs > cypress-artifacts/docker-logs.txt
          docker compose cp cypress:/app/cypress/screenshots cypress-artifacts/ || true
          docker compose cp cypress:/app/cypress/videos cypress-artifacts/ || true
          
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-artifacts-${{ github.run_id }}
          path: cypress-artifacts/
          retention-days: 7
          
      - name: Cleanup containers
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          docker system prune -f || true

  analyze-test-results:
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [backend-unit-tests, frontend-unit-tests, frontend-e2e-tests]
    steps:
      - name: Analyze test results
        run: |
          echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit Tests | ${{ needs.backend-unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests | ${{ needs.frontend-unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend E2E Tests | ${{ needs.frontend-e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY