apiVersion: v1
kind: ConfigMap
metadata:
  name: datareporter-env
  labels:
    app.kubernetes.io/name: datareporter
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v2025.3.1"
    app.kubernetes.io/managed-by: Helm
data:
  PLYWOOD_SERVER_SCHEMA: "http"
  PLYWOOD_SERVER_HOSTNAME: ""
  PLYWOOD_SERVER_PORT: "3000"
  PYTHONUNBUFFERED: "0"
  SQLALCHEMY_ENABLE_POOL_PRE_PING: "true"
  DATAREPORTER_ENSURE_SCHEMA: "true"
