---
# Source: datareporter/templates/plywood-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datareporter-plywood
  labels:
    app.kubernetes.io/name: datareporter
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v2025.3.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: plywood
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datareporter
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: plywood
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plywood
        app.kubernetes.io/name: datareporter
        app.kubernetes.io/instance: release-name
    spec:
      serviceAccountName: datareporter
      securityContext: {}
      containers:
        - name: datareporter-plywood
          securityContext: {}
          image: "europe-west1-docker.pkg.dev/datareporter/datareporter/plywood:v2025.3.1"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
          env:
            - name: PORT
              value: "3000"
          resources: {}
