---
# Source: datareporter/templates/scheduler-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datareporter-scheduler
  labels:

    app.kubernetes.io/name: datareporter
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v2025.3.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datareporter
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datareporter
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: datareporter
      securityContext:
        {}
      containers:
        - name: datareporter-scheduler
          securityContext:
            {}
          image: "europe-west1-docker.pkg.dev/datareporter/datareporter/datareporter:v2025.3.1"
          imagePullPolicy: "IfNotPresent"
          command: ["/bin/sh"]
          args: ["-c", ". /config/dynamicenv.sh && /app/bin/docker-entrypoint scheduler"]
          volumeMounts:
            - name: config
              mountPath: /config

          envFrom:
          - configMapRef:
              name: datareporter-env
          - secretRef:
              name: datareporter

          resources: {}
      volumes:
        - name: config
          configMap:
            name: datareporter
