[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plywood"
version = "0.1.0"
description = "Python port of the Plywood expression tree → SQL translator"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "lzstring>=1.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
